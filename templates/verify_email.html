{% extends 'base.html' %}
{% block title %}Verificar acesso · Dizipy{% endblock %}
{% block content %}
<section class="card">
  <h1>Confirme seu acesso</h1>
  <p>Digite o código de seis dígitos enviado ao e-mail da sua conta. Ele expira em 10 minutos.</p>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label>Código de acesso<input name="code" required inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}"></label>
    <button>Verificar código</button>
  </form>
  <p class="spaced"><a href="{{ url_for('home') }}">Voltar para entrar</a></p>
</section>
{% endblock %}
