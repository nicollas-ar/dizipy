services:
  - type: web
    name: dizipy
    runtime: python
    branch: asaas-sandbox
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: DIZIPY_HOSTED
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: DIZIPY_ENCRYPTION_KEY
        generateValue: true
      - key: DIZIPY_SECRET_KEY
        generateValue: true
      - key: DIZIPY_SETUP_TOKEN
        generateValue: true
      - key: DIZIPY_ADMIN_EMAIL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: DIZIPY_EMAIL_FROM
        sync: false
      - key: SERPRO_CONSUMER_KEY
        sync: false
      - key: SERPRO_CONSUMER_SECRET
        sync: false
